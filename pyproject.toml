[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-battle"
version = "0.1.0"
description = "SOLID-oriented game server module for object movement in Space Battle"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Nikita Erilov" }
]

dependencies = [
    "pytest>=9.0.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0.2"
addopts = "-ra -q"
testpaths = ["tests"]